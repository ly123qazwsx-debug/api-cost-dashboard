name: Enable GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Publish from main root
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          payload='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          status=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/pages")
          echo "GET /pages -> ${status}"
          cat /tmp/pages.json
          echo
          if [ "$status" = "200" ]; then
            method=PUT
          else
            method=POST
          fi
          code=$(curl -sS -o /tmp/pages-write.json -w '%{http_code}' \
            -X "$method" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "https://api.github.com/repos/${REPO}/pages")
          echo "${method} /pages -> ${code}"
          cat /tmp/pages-write.json
          echo
          case "$code" in
            200|201|204) ;;
            *) exit 1 ;;
          esac
          build=$(curl -sS -o /tmp/pages-build.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/pages/builds")
          echo "POST /pages/builds -> ${build}"
          cat /tmp/pages-build.json
          echo
          case "$build" in
            200|201) ;;
            *) echo "Build request was not accepted; site configuration above still stands." ;;
          esac
